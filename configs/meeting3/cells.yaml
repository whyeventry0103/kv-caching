# Meeting #3 execution ledger -- DECLARATIVE CELL LIST.
#
# One entry per experimental cell. scripts/meeting3_manifest.py turns this into
# results/meeting3/manifest.json, computing the hashes (config, source tree,
# artifacts) rather than trusting hand-typed ones, and refusing unknown statuses.
#
# Status ladder (a cell only moves up after its check passes):
#   NOT_STARTED  nothing exists
#   IMPLEMENTED  code/config exist
#   TESTED       unit/CPU tests pass
#   VALIDATED    real-model (GPU) smoke passed its gate
#   QUEUED       in configs/nightly_queue.yaml with its dependency chain
#   RUNNING      generation in flight
#   GENERATED    all expected units written and coverage-checked
#   ANALYZED     the registered read has run
#   COMPLETE     gates + coverage + analysis + figure all pass
#   BLOCKED      cannot advance without an action outside this session's authority
#   INVALID      instrument failed its gate; kept as record, never read as a result
#
# Protocol identities: "Q" = Amendment Q (2026-09-12); "R" = Amendment R
# (2026-09-24), which registers the corrections and new cells below BEFORE any
# of their outcomes exist.

model:
  key: r1_distill_qwen_7b
  handle: deepseek-ai/DeepSeek-R1-Distill-Qwen-7B
  revision: 916b56a44061fd5cd7d6a8fb632557ed4f724f60

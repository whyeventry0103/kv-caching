budgets: [128, 256, 512, 1024, 2048]
report_compression_ratio: true
presses:
  fullcache:
    implementation: builtin
  streamingllm:
    implementation: kvpress-prefill-only
    decoding_status: adapter-required
    note: Pinned kvpress 0.2.10 has no decoding-time budget API.
  h2o:
    implementation: adapter-required
    note: TODO(human) verify semantic mapping in pinned kvpress else port
  snapkv:
    implementation: kvpress-prefill-only
    decoding_status: adapter-required
    note: Stock SnapKVPress compresses prefill only; a SnapKV-D-style adapter is required.
  rkv:
    implementation: adapter-required
    note: TODO(human) verify implementation against paper else port
  kivi2:
    implementation: deferred-cache-wrapper
    note: TODO(human) implement as quantized cache wrapper, not eviction press
  random:
    implementation: kvpress-prefill-only
    decoding_status: adapter-required
    role: random-eviction floor
  expected_attention:
    implementation: kvpress-prefill-only
    decoding_status: adapter-required
    note: Verify behavior and add decoding-time budget control before baseline use.
  triattention:
    implementation: deferred
    note: TODO(human) identify paper-faithful implementation before inclusion

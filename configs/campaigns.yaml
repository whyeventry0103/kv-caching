# Cumulative allocated-GPU-hour caps for approved campaigns (Meeting 5 review G0.2).
# Enforced before launch by scripts/nightly_autorun.py via kvcache.campaign_budget;
# a queue job joins a campaign with `campaign: <ID>`. Caps are TOTAL allocated GPU
# time (summed over GPUs, including model loading, failures and retries), not
# per-night limits. Normal 01:45-10:43 Dubai windows only.
campaigns:
  P1:
    cap_gpu_hours: 20
    approved: 2026-10-06
    scope: protected B=1024 reverse readout (reverse-readout-pp1024, 800 rows)
  P2:
    cap_gpu_hours: 2
    approved: 2026-10-06
    scope: protected-selector real-generation smoke (protsel-smoke)
  P3:
    cap_gpu_hours: 6
    approved: 2026-10-06
    scope: protected-selector timing pilot, all three stages combined (48 rows)
  # Meeting 5 essential pair + smoke, APPROVED by the owner 2026-10-14
  # (docs/paper/MEETING5_APPROVAL_REQUEST.md A1-A3). Fresh-uniform (A4) and the
  # capacity comparators (A5) are NOT approved and have no campaign.
  M5A-RKVPP-SMOKE:
    cap_gpu_hours: 1
    approved: 2026-10-14
    scope: protected R-KV real-model smoke (rkvpp-smoke, 9 records)
  M5A-H2OPP:
    cap_gpu_hours: 28
    approved: 2026-10-14
    scope: H2O-style protected free runs, B=256, 100 problems x 4 seeds (400 rows)
  M5A-RKVPP:
    cap_gpu_hours: 28
    approved: 2026-10-14
    scope: R-KV protected free runs, B=256, 100 problems x 4 seeds (400 rows)
  # Meeting 5 M5-C information-channel calibration, APPROVED by the owner
  # in-session 2026-10-17 (docs/paper/MEETING5_CALIBRATION_APPROVAL_REQUEST.md).
  # Calibration only: the confirmation run and the reasoning bridge are
  # separate decisions with no campaign.
  M5C-CAL:
    cap_gpu_hours: 4
    approved: 2026-10-17
    scope: information-channel calibration (info-calibration-m5c, 640 rows; never confirmatory)

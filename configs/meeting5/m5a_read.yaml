name: m5a_read
version: 2
# Meeting 5 M5-A read spec (prepared 2026-10-14 before any protected H2O-style or
# R-KV row; v2 after the review of 6b409001, R1). Consumed by
# scripts/report_policy_replication.py. Every SOURCE run is validated in full
# against its own config's design (frozen 100 problems x seeds x presses x
# budgets) BEFORE the cohort is selected; an absent source reads PARTIAL.
reference: random
pairings: [h2o, streamingllm]   # the two scientific pairings (Holm over 2)
descriptive: [rkv]              # declared third comparison, descriptive
model: r1_distill_qwen_7b
bench: math500
seeds: [11, 23, 47, 89]
cohort_source: configs/meeting5/strict_fit_b256.json   # frozen from the inventory
# Owner decision 2026-10-14, before any M5 outcome (protocol 4.3).
equivalence:
  alpha: 0.05
  primary_margin: 0.03
  sensitivity_margin: 0.05
  per_comparison: TOST on the protected contrast, Holm over the scientific pairings
  joint: intersection-union over the scientific pairings (every TOST p <= alpha)
  degenerate_se: NOT TESTABLE; the observed difference is reported descriptively
# provenance: legacy = historical rows (runmeta + versions; no identity block,
# none fabricated); m5 = rows of scripts/run_grid_m5.py, which must carry the
# expected identity and the frozen prompt hash (kvcache.m5_runs).
sources:
  grid-diss256-tok:
    config: configs/experiments/grid_math500_dissociation.yaml
    provenance: legacy
  grid-pp256:
    config: configs/experiments/grid_math500_pp256_s1.yaml
    provenance: legacy
  grid-diss256-h2o:
    config: configs/experiments/grid_math500_diss256_h2o.yaml
    provenance: legacy
  grid-diss256-rkv:
    config: configs/experiments/grid_math500_diss256_rkv.yaml
    provenance: legacy
  grid-h2opp256-m5:
    config: configs/experiments/grid_math500_h2opp256_m5.yaml
    provenance: m5
  grid-rkvpp256-m5:
    config: configs/experiments/grid_math500_rkvpp256_m5.yaml
    provenance: m5
arms:
  random:
    unprotected: [grid-diss256-tok, random]
    protected: [grid-pp256, random_pp]
  streamingllm:
    unprotected: [grid-diss256-tok, streamingllm]
    protected: [grid-pp256, streamingllm_pp]
  h2o:
    unprotected: [grid-diss256-h2o, h2o]
    protected: [grid-h2opp256-m5, h2o_style_pp_v1]
  rkv:
    unprotected: [grid-diss256-rkv, rkv]
    protected: [grid-rkvpp256-m5, rkv_pp_v1]
# Whole-cohort read only: unprotected rows of the 3 relaxed problems at the
# protected arm's effective budget (manifest M5A-CAPMATCH; not approved, not
# generated). Until it exists the whole-cohort read is PARTIAL and is never
# labelled capacity-matched.
capmatch_run: grid-capmatch-m5

name: info_calibration_m5c
# Meeting 5 M5-C information-channel CALIBRATION (prepared 2026-10-14; APPROVED
# by the owner in-session 2026-10-17, campaign M5C-CAL, cap 4 GPU-h). Calibration
# records are never confirmatory. Runs through scripts/run_information_probe.py.
# Design: protocol section 6 (docs/protocol/MEETING5_INFORMATION_PROTOCOL.md).
held: false
models: [r1_distill_qwen_7b]
design_seed: 20261014
n_blocks: 4
# Checked against the PINNED tokenizer on 2026-10-14 (--check-tokenizer): each
# value is one token in answer position; every alias gives a 5-token fact.
values: [fox, owl, cat, dog]
aliases: [zorp, quix, blen, vosk, pell, dral, mook]
spec:
  body_tokens: 1024
  early_offset: 64
  late_offset: 768
policies: [full, random_pp, streamingllm_pp, h2o_style_pp_v1, rkv_pp_v1]
budget: 256
compression_interval: 64
eviction_seeds: [0]
queries: [s, n]
paired_contrasts: [[random_pp, h2o_style_pp_v1]]
filler:
  reference_run: math500-fc-powered-merged
  seed: 11
  # filler passages come from the MATH-500 confirmation RESERVE (outside the
  # discovery cohort and the confirmation set), so no reasoning trace of a
  # scored problem is reused
  pids_from: configs/meeting5/problem_manifests.json
  pids_key: [math500, reserve]
  n_passages: 40
  passage_tokens: 900
proposed_cap_gpu_hours: 4
# Numerical calibration acceptance, FROZEN 2026-10-15 before any calibration
# data exist (review of d50aa40, item 4; protocol 6.8). Evaluated by
# kvcache.information_calibration over a FINAL production read. PASS needs every
# criterion; on FAIL the protocol allows ONE redesign on calibration data, then
# the instrument is abandoned (gate G2). Calibration rows are never confirmatory.
calibration_criteria:
  # C1 the full cache reads out both facts through the declared channel
  full_min_mi_bits: 1.5
  full_min_correct_prob: 0.80
  # C2 the answer format works (OTHER mass is not dominating)
  full_max_other_prob: 0.20
  # C4 end-to-end (no clone) readout agrees with the cloned readout
  max_e2e_abs_logprob_diff: 0.001
  # C5 eviction actually touches the facts in the evicting arms
  max_mean_early_span_retained: 0.90
  # C6 dynamic range: target-query MI differs across arms, not floor/ceiling
  min_mi_range_bits: 0.25
  ceiling_mi_bits: 1.9
  # C6 floor, added 2026-10-16 BEFORE any calibration data (review of 5616630,
  # R3; protocol 6.8 / section 9): at least one compressed arm must carry
  # >= 0.1 bits about the target. 0.1 bits is 5% of the 2-bit channel maximum
  # (and below the 0.25-bit range requirement): an arm under it is close to
  # uninformative, and if EVERY compressed arm is under it the task shows only
  # catastrophic loss and cannot compare compressed policies at this operating
  # point. No policy ordering is required.
  floor_mi_bits: 0.1

  # --- Q.2 onset-staggered replay, D_tv half. The experiment M.3 pointed at and
  # could not reach: t0 is a genuine third variable, because r = B/t says
  # nothing about how long compression has been running. Teacher-forced, cheap.
  # t0=0 is the always-on reference arm and must reproduce existing behaviour.

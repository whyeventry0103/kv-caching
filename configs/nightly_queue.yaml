# Ordered job queue for scripts/nightly_autorun.py (the nightly auto-launch orchestrator).
# Each night at 02:00 (Asia/Dubai) the orchestrator launches the FIRST job that is
# (a) incomplete and (b) has its `requires` dependency complete, GPU-aware + OOM-safe.
#
# enabled: false is the kill-switch (orchestrator exits 0 immediately).
# Appending a job needs no code change. min_free_gb is the per-job OOM threshold.
version: 1
enabled: true
jobs:
  # The token-ID 256 re-run (reproduces the phenomenon + makes traces reverse-replay-ready).
  - name: grid-diss256-tok
    command: grid
    config: configs/experiments/grid_math500_dissociation.yaml
    run_name: grid-diss256-tok
    total: 800
    seeds: [11, 23, 47, 89]
    min_free_gb: 24          # budget-256 free-run under compression ~18-19GB + headroom
    progress_kind: grid      # counts runs/grid-diss256-tok/math500/**/*.jsonl (excl token_ids)
    requires: null

  # Reverse readout: the compressed traces read out under FULL cache -> residual bracket.
  - name: reverse-readout-diss256
    command: replay
    config: configs/experiments/reverse_readout_diss256.yaml
    run_name: reverse-readout-diss256
    total: 800
    seeds: [11, 23, 47, 89]
    min_free_gb: 28          # FULL-cache teacher-forcing on 8-16k traces -> more memory
    progress_kind: readout   # counts runs/reverse-readout-diss256/readout/**/*.jsonl
    requires: grid-diss256-tok

  # Per-step TV-divergence profiles over the FC reference (Figure 4 / the mechanism panel).
  - name: replay-diss256
    command: replay
    config: configs/experiments/replay_math500_diss256.yaml
    run_name: replay-diss256
    total: 800
    seeds: [11, 23, 47, 89]
    min_free_gb: 24
    progress_kind: grid      # compression_replay writes rows to math500/ (profiles sidecar)
    requires: null           # references the FC bank, independent of grid-diss256-tok

  # --- Budget-2048 "silent-flip" regime (the other half of the story) ---
  - name: grid-diss2048-tok
    command: grid
    config: configs/experiments/grid_math500_diss2048.yaml
    run_name: grid-diss2048-tok
    total: 800
    seeds: [11, 23, 47, 89]
    min_free_gb: 24
    progress_kind: grid
    requires: null

  # --- H2O (3rd eviction method) for the generality envelope. Needs EAGER attention
  # (run_grid/run_replay auto-load it); eager materializes attention -> higher memory, so
  # min_free_gb is conservative (36). Monitor logs/grid-diss256-h2o.log for OOM on the
  # rambling budget-256 traces; if it OOMs, lower max_new_tokens for the h2o grid. ---
  - name: grid-diss256-h2o
    command: grid
    config: configs/experiments/grid_math500_diss256_h2o.yaml
    run_name: grid-diss256-h2o
    total: 400
    seeds: [11, 23, 47, 89]
    min_free_gb: 36
    progress_kind: grid
    requires: null
  - name: readout-diss256-h2o
    command: replay
    config: configs/experiments/readout_math500_diss256_h2o.yaml
    run_name: readout-diss256-h2o
    total: 400
    seeds: [11, 23, 47, 89]
    min_free_gb: 36
    progress_kind: readout
    requires: null

  # Reverse readout for the H2O-style cells -> completes the residual BRACKET on a
  # third eviction policy (grid-diss256-h2o stores token-ID sidecars; full-cache
  # readout, so sdpa + modest memory like the original reverse job).
  - name: reverse-readout-diss256-h2o
    command: replay
    config: configs/experiments/reverse_readout_diss256_h2o.yaml
    run_name: reverse-readout-diss256-h2o
    total: 400
    seeds: [11, 23, 47, 89]
    min_free_gb: 28
    progress_kind: readout
    requires: grid-diss256-h2o

  # readout-2048 runs AFTER H2O-256: H2O is the method HOTT reports as surviving, so
  # testing method-invariance of the trajectory residual against it is highest-value.
  - name: readout-diss2048
    command: replay
    config: configs/experiments/readout_math500_diss2048.yaml
    run_name: readout-diss2048
    total: 800
    seeds: [11, 23, 47, 89]
    min_free_gb: 24
    progress_kind: readout
    requires: null           # references the FC bank

  - name: grid-diss2048-h2o
    command: grid
    config: configs/experiments/grid_math500_diss2048_h2o.yaml
    run_name: grid-diss2048-h2o
    total: 400
    seeds: [11, 23, 47, 89]
    min_free_gb: 36
    progress_kind: grid
    requires: null
  - name: readout-diss2048-h2o
    command: replay
    config: configs/experiments/readout_math500_diss2048_h2o.yaml
    run_name: readout-diss2048-h2o
    total: 400
    seeds: [11, 23, 47, 89]
    min_free_gb: 36
    progress_kind: readout
    requires: null

  # TV profiles for the H2O-style press (mechanism / Figure-4 extension to a third
  # policy; eager attention -> conservative min_free_gb like the other h2o jobs).
  - name: replay-diss256-h2o
    command: replay
    config: configs/experiments/replay_math500_diss256_h2o.yaml
    run_name: replay-diss256-h2o
    total: 400
    seeds: [11, 23, 47, 89]
    min_free_gb: 36
    progress_kind: grid
    requires: null

  # ================= R-KV (4th method; the reasoning-specific press) =============
  # Gate first: the real-generation smoke (Amendment E's last gate). On PASS it
  # writes <runs_root>/rkv-gen-smoke-PASS.json, which mechanically promotes the rkv
  # press; the cells below `requires` this job so the chain is fully autonomous.
  - name: rkv-smoke
    command: rkvsmoke
    config: configs/experiments/rkv_smoke.yaml
    run_name: rkv-smoke
    total: 1
    seeds: [11]
    min_free_gb: 24
    progress_kind: marker
    marker: rkv-gen-smoke-PASS.json
    requires: null

  - name: grid-diss256-rkv
    command: grid
    config: configs/experiments/grid_math500_diss256_rkv.yaml
    run_name: grid-diss256-rkv
    total: 400
    seeds: [11, 23, 47, 89]
    min_free_gb: 28
    progress_kind: grid
    requires: rkv-smoke
  - name: readout-diss256-rkv
    command: replay
    config: configs/experiments/readout_math500_diss256_rkv.yaml
    run_name: readout-diss256-rkv
    total: 400
    seeds: [11, 23, 47, 89]
    min_free_gb: 28
    progress_kind: readout
    requires: rkv-smoke
  - name: reverse-readout-diss256-rkv
    command: replay
    config: configs/experiments/reverse_readout_diss256_rkv.yaml
    run_name: reverse-readout-diss256-rkv
    total: 400
    seeds: [11, 23, 47, 89]
    min_free_gb: 28
    progress_kind: readout
    requires: grid-diss256-rkv

  # ============ Cross-architecture replication (R1-Distill-Llama-8B) =============
  # The Threats section's named check: does the decomposition reproduce on a Llama
  # base? Subset scale (50 problems x n=4); its own pinned FC reference bank.
  - name: fc-llama50
    command: bank
    config: configs/experiments/bank_math500_llama.yaml
    run_name: fc-llama50
    total: 200
    seeds: [11, 23, 47, 89]
    min_free_gb: 30
    progress_kind: grid
    requires: null
    extra_args: ["--allow-model-download"]  # Llama-8B not yet in the remote HF cache
  - name: grid-diss256-llama
    command: grid
    config: configs/experiments/grid_math500_diss256_llama.yaml
    run_name: grid-diss256-llama
    total: 400
    seeds: [11, 23, 47, 89]
    min_free_gb: 30
    progress_kind: grid
    requires: fc-llama50
  - name: readout-diss256-llama
    command: replay
    config: configs/experiments/readout_math500_diss256_llama.yaml
    run_name: readout-diss256-llama
    total: 400
    seeds: [11, 23, 47, 89]
    min_free_gb: 30
    progress_kind: readout
    requires: fc-llama50
  - name: reverse-readout-diss256-llama
    command: replay
    config: configs/experiments/reverse_readout_diss256_llama.yaml
    run_name: reverse-readout-diss256-llama
    total: 400
    seeds: [11, 23, 47, 89]
    min_free_gb: 30
    progress_kind: readout
    requires: grid-diss256-llama

  # ================= AIME-24 (2nd benchmark; R-KV's >100% regime) ================
  # Long traces -> slower rows/night; sits last so the drop-dead (2026-08-01)
  # governs it cleanly. grid requires the rkv smoke (its press list includes rkv).
  - name: fc-aime24
    command: bank
    config: configs/experiments/bank_aime24_fc.yaml
    run_name: fc-aime24
    total: 240
    seeds: [11, 23, 47, 89, 131, 197, 263, 347]
    min_free_gb: 24
    progress_kind: grid
    bench: aime24
    requires: null
    extra_args: ["--allow-dataset-download"]  # pinned AIME-24 dataset, first fetch
  - name: grid-aime24-2048
    command: grid
    config: configs/experiments/grid_aime24_2048.yaml
    run_name: grid-aime24-2048
    total: 360
    seeds: [11, 23, 47, 89]
    min_free_gb: 28
    progress_kind: grid
    bench: aime24
    requires: fc-aime24  # dataset cached by the bank job; rkv gated by its marker
  - name: readout-aime24-2048
    command: replay
    config: configs/experiments/readout_aime24_2048.yaml
    run_name: readout-aime24-2048
    total: 360
    seeds: [11, 23, 47, 89]
    min_free_gb: 28
    progress_kind: readout
    requires: fc-aime24

  # ====== Readout-resampling control (submission-audit addition, 2026-07-07) =====
  # Full-cache readout of the FC bank itself: Acc_ro(FC) - Acc_FC = the pure
  # answer-resampling effect of the readout protocol, zero compression involved.
  # Deliberately LAST: defensive calibration, nothing in the paper's headline
  # depends on it, so it must never delay a paper-critical cell.
  - name: readout-fc-control
    command: replay
    config: configs/experiments/readout_math500_fc_control.yaml
    run_name: readout-fc-control
    total: 400
    seeds: [11, 23, 47, 89]
    min_free_gb: 28
    progress_kind: readout
    requires: null           # references only the FC bank, which exists

  # ========== Scale axis (AC plan 2026-07-17; Amendment J): 1.5B then 14B =========
  # StreamingLLM (sharpest case) + R-KV (strongest method) at 50x4, own FC banks.
  # 1.5B first: cheap, fast, entire chain ~1 night. 14B after: ~40GB weights+cache,
  # conservative min_free_gb; expect ~3-4 nights for its chain.
  - name: fc-q15b
    command: bank
    config: configs/experiments/bank_math500_q15b.yaml
    run_name: fc-q15b
    total: 200
    seeds: [11, 23, 47, 89]
    min_free_gb: 16
    progress_kind: grid
    requires: null
    extra_args: ["--allow-model-download"]  # ~3.5GB, first fetch
  - name: grid-diss256-q15b
    command: grid
    config: configs/experiments/grid_math500_diss256_q15b.yaml
    run_name: grid-diss256-q15b
    total: 400
    seeds: [11, 23, 47, 89]
    min_free_gb: 16
    progress_kind: grid
    requires: fc-q15b        # model cached by the bank job; rkv gated by its marker
  - name: readout-diss256-q15b
    command: replay
    config: configs/experiments/readout_math500_diss256_q15b.yaml
    run_name: readout-diss256-q15b
    total: 400
    seeds: [11, 23, 47, 89]
    min_free_gb: 16
    progress_kind: readout
    requires: fc-q15b
  - name: reverse-readout-diss256-q15b
    command: replay
    config: configs/experiments/reverse_readout_diss256_q15b.yaml
    run_name: reverse-readout-diss256-q15b
    total: 400
    seeds: [11, 23, 47, 89]
    min_free_gb: 16
    progress_kind: readout
    requires: grid-diss256-q15b

  - name: fc-q14b
    command: bank
    config: configs/experiments/bank_math500_q14b.yaml
    run_name: fc-q14b
    total: 200
    seeds: [11, 23, 47, 89]
    min_free_gb: 40
    progress_kind: grid
    requires: null
    extra_args: ["--allow-model-download"]  # ~28GB, first fetch; disk checked by guard
  - name: grid-diss256-q14b
    command: grid
    config: configs/experiments/grid_math500_diss256_q14b.yaml
    run_name: grid-diss256-q14b
    total: 400
    seeds: [11, 23, 47, 89]
    min_free_gb: 40
    progress_kind: grid
    requires: fc-q14b
  - name: readout-diss256-q14b
    command: replay
    config: configs/experiments/readout_math500_diss256_q14b.yaml
    run_name: readout-diss256-q14b
    total: 400
    seeds: [11, 23, 47, 89]
    min_free_gb: 40
    progress_kind: readout
    requires: fc-q14b
  - name: reverse-readout-diss256-q14b
    command: replay
    config: configs/experiments/reverse_readout_diss256_q14b.yaml
    run_name: reverse-readout-diss256-q14b
    total: 400
    seeds: [11, 23, 47, 89]
    min_free_gb: 40
    progress_kind: readout
    requires: grid-diss256-q14b

  # ---- 2026-07-29 batch: confirmatory + gap-closing cells ------------------
  # Reads pre-registered BEFORE queueing: Amendment L/M.5 (512/1024) and
  # Amendment N (HOTT cap, R-KV published config). Do not re-derive them.

  # Budgets 512 and 1024: the CONFIRMATORY test of the resolution-collapse
  # finding. Amendment L pre-commits the prediction (ratio strictly between the
  # 256 value 0.78 and the 2048 value 0.12, monotone in budget); a ratio outside
  # [0.12, 0.78] or a non-monotone ordering REFUTES the gradual-collapse reading
  # and is to be reported as a refutation.
  - name: grid-diss512
    command: grid
    config: configs/experiments/grid_math500_diss512.yaml
    run_name: grid-diss512
    total: 800
    seeds: [11, 23, 47, 89]
    min_free_gb: 24
    progress_kind: grid
    requires: null
  - name: readout-diss512
    command: replay
    config: configs/experiments/readout_math500_diss512.yaml
    run_name: readout-diss512
    total: 800
    seeds: [11, 23, 47, 89]
    min_free_gb: 24
    progress_kind: readout
    requires: grid-diss512
  - name: grid-diss1024
    command: grid
    config: configs/experiments/grid_math500_diss1024.yaml
    run_name: grid-diss1024
    total: 800
    seeds: [11, 23, 47, 89]
    min_free_gb: 24
    progress_kind: grid
    requires: readout-diss512
  - name: readout-diss1024
    command: replay
    config: configs/experiments/readout_math500_diss1024.yaml
    run_name: readout-diss1024
    total: 800
    seeds: [11, 23, 47, 89]
    min_free_gb: 24
    progress_kind: readout
    requires: grid-diss1024

  # HOTT-configuration cell (Amendment N.1). Cap 2048, everything else ours.
  # Cheap: the cap itself bounds runtime.
  - name: bank-hottcap
    command: bank
    config: configs/experiments/bank_math500_hottcap.yaml
    run_name: bank-hottcap
    total: 400
    seeds: [11, 23, 47, 89]
    min_free_gb: 24
    progress_kind: grid
    requires: null
  - name: grid-hottcap
    command: grid
    config: configs/experiments/grid_math500_hottcap.yaml
    run_name: grid-hottcap
    total: 400
    seeds: [11, 23, 47, 89]
    min_free_gb: 24
    progress_kind: grid
    requires: null

  # R-KV in its published configuration (Amendment N.2), and the bank it needs.
  # Amendment O: re-run at the published 32768 cap under NEW run names. The
  # 16384 artifacts (fc-aime24-llama8b, gate-failed at 0.2750) are permanent
  # record and are deliberately not resumed into, renamed, or deleted.
  - name: fc-aime24-llama8b-cap32768
    command: bank
    config: configs/experiments/bank_aime24_llama8b.yaml
    run_name: fc-aime24-llama8b-cap32768
    total: 120
    seeds: [11, 23, 47, 89]
    min_free_gb: 40
    progress_kind: grid
    bench: aime24
    requires: null
  # grid-aime24-rkv-published-cap32768 is COMPLETE and has been retired from the
  # queue (2026-08-04). Its 120 rows are under run names `rkvpub-g0` / `rkvpub-g1`,
  # because it was launched manually via launch_tmux.sh the moment the bank cleared
  # its gate rather than waiting for the 01:45 window. The orchestrator counts
  # progress by RUN DIRECTORY, so those rows were invisible to it and it relaunched
  # the same job into `grid-aime24-rkv-published-cap32768`, reaching 47 rows before
  # its window closed. Those 47 rows are kept: they overlap the cell exactly and
  # agree with it on every field, which is recorded as a determinism check in
  # PREREGISTRATION Amendment N.2's result. They are NOT part of the cell.
  #
  # The lesson, since the queue is the plan: a manual launch must use the queue's
  # run_name, or the queue cannot see the work and will duplicate it.
  # Read: Amendment N.2, branch REPLICATES. Artifact
  # results/diag/amendment-k/classb/rkv_published_cap32768.json.

  # ---- Meeting #2 / Amendment P.4: the extended replay pass ----------------
  # Gate-passed before queueing: scripts/gate_extended_replay.py showed the v2
  # emitter reproduces v1 TV bitwise (worst delta 0.0 over 15,280 steps on 6
  # shared profiles). Three of the four Meeting-2 tasks depend on this artifact,
  # so it runs first. ~120 s/profile measured => ~27 GPU-hours, about 1.5 nights
  # across both GPUs.
  - name: replay-ext-diss256
    command: replay
    config: configs/experiments/replay_ext_math500_diss256.yaml
    run_name: replay-ext-diss256
    total: 800
    seeds: [11, 23, 47, 89]
    min_free_gb: 28
    progress_kind: grid
    requires: null

  # ---- P.5 restoration: gate first, then the powered cell -------------------
  # The smoke's ONLY job is the retained-set instrument gate (reinserted K/V
  # present and bitwise identical). Amendment P.5 refuses to read divergence
  # until it passes, so the powered cell `requires` it.
  - name: restoration-smoke
    command: replay
    config: configs/experiments/restoration_smoke.yaml
    run_name: restoration-smoke
    total: 24
    seeds: [11]
    min_free_gb: 28
    progress_kind: grid
    requires: replay-ext-diss256
  - name: restoration-diss256
    command: replay
    config: configs/experiments/restoration_diss256.yaml
    run_name: restoration-diss256
    total: 800
    seeds: [11, 23, 47, 89]
    min_free_gb: 28
    progress_kind: grid
    requires: restoration-smoke

  # ---- M.3 ratio-matched control -------------------------------------------
  # Gates the INTERPRETATION of every divergence profile: until it runs, the
  # staircase is equally consistent with a compression-ratio curve. Queued after
  # restoration because restoration is a new mechanism while this is a control
  # on an existing reading; reorder if the reading is needed sooner.
  - name: replay-ratio-matched-m3
    command: replay
    config: configs/experiments/replay_ratio_matched_m3.yaml
    run_name: replay-ratio-matched-m3
    total: 200
    seeds: [11, 23, 47, 89]
    min_free_gb: 28
    progress_kind: grid
    requires: restoration-diss256


  # ---- P.5 re-run after the index-space bug ---------------------------------
  # restoration-diss256 completed 800/800 and was INVALIDATED: plan_reinsertion
  # intersected two different index spaces (stash indices vs live-cache
  # indices), which barred the `matched` arm from evicting the most recent
  # quarter of the cache while `random` evicted it at the uniform rate. The arms
  # therefore differed in two ways at once and `random` (-0.248) could not serve
  # as the control for `matched` (-0.001). See PREREGISTRATION "Amendment P.5,
  # correction (2026-08-13)".
  #
  # The invalid 800 profiles are PERMANENT RECORD under run name
  # `restoration-diss256`: not resumed into, not renamed, not deleted -- the same
  # treatment as the gate-failed fc-aime24-llama8b artifacts above. The corrected
  # cell runs under a new run name against the SAME config, since only the press
  # internals changed.
  #
  # Ordered after M.3 because M.3 was already in flight when the bug was found,
  # and M.3 gates the interpretation of every divergence profile including this
  # one.
  - name: restoration-diss256-v2
    command: replay
    config: configs/experiments/restoration_diss256.yaml
    run_name: restoration-diss256-v2
    total: 800
    seeds: [11, 23, 47, 89]
    min_free_gb: 28
    progress_kind: grid
    requires: replay-ratio-matched-m3

  # ---- M.3 re-run after the floor-collapse bug ------------------------------
  # replay-ratio-matched-m3 completed 200/200 and was INVALIDATED: the press
  # computed target_size against keys.shape[2] -- the CURRENT CACHE, i.e. the
  # previous compression's own output -- instead of the logical context. That is
  # a feedback loop: compress to 32, accrue 64, round(0.038*96)=4 -> floor 32,
  # forever. All 377,104 compression events across all 200 traces sat at the
  # floor, so the cell was a constant-32 budget -- the exact property M.3 exists
  # to remove. See PREREGISTRATION "Amendment M.3, correction (2026-08-14)".
  #
  # The invalid 200 profiles are PERMANENT RECORD under run name
  # `replay-ratio-matched-m3`. Same config; only the press internals changed.
  #
  # This still GATES the interpretation of every divergence profile, including
  # P.2's eviction-locking result. It is ordered after the restoration re-run
  # only because that run was already in flight when this bug was found.
  - name: replay-ratio-matched-m3-v2
    command: replay
    config: configs/experiments/replay_ratio_matched_m3.yaml
    run_name: replay-ratio-matched-m3-v2
    total: 200
    seeds: [11, 23, 47, 89]
    min_free_gb: 28
    progress_kind: grid
    requires: restoration-diss256-v2

  # ---- P.2-v2: the last open Meeting-#2 item (CPU-ONLY re-analysis) ---------
  # Does Random's eviction-locking survive ratio-matching? M.3 delicensed the
  # mechanistic reading of the rising profile and left this unresolved, because
  # Random's phase-0 peak is exactly what a ratio-driven curve would produce.
  #
  # NO GPU, NO GENERATION. It re-reads profiles that already exist in
  # replay-ratio-matched-m3-v2 and takes about a minute. min_free_gb is 1 only
  # because the schema requires a number; the job never touches a GPU. It is
  # queued rather than run by hand so it executes unattended in the 01:45 window
  # like everything else, and so its provenance sits in the same place.
  #
  # The read condition and its three branches were pre-registered BEFORE any
  # number was computed -- PREREGISTRATION.md "Amendment P.2-v2, read condition"
  # (2026-08-24). Do NOT re-cut the verdict after seeing the output.
  #
  # progress_kind: marker -- done when the artifact exists, since there are no
  # rows to count.
  - name: shape-p2v2-restricted
    command: shape
    config: configs/experiments/shape_p2v2_restricted.yaml
    run_name: shape-p2v2-restricted
    total: 1
    seeds: [11]
    min_free_gb: 1
    progress_kind: marker
    marker: shape-p2v2-restricted/shape_m3v2_RESTRICTED.json
    requires: replay-ratio-matched-m3-v2

  # ======================================================================
  # MEETING #3 / AMENDMENT Q (queued 2026-09-12).
  #
  # Ordered by defensibility per GPU-hour, not by the order the tasks were
  # given. Every read below was pre-committed in PREREGISTRATION Amendment Q
  # BEFORE any of these were queued; do not re-cut a verdict after seeing
  # output.
  #
  # est_output_gb is the Amendment Q storage guard. The values were MEASURED on
  # 2026-09-15 from completed runs of the same shape and rounded up, replacing
  # the original guesses -- which were low by 20-33% on every cell, the one
  # direction that matters, because a low estimate lets a cell through that does
  # not fit. Recalibrate the same way if a cell's shape changes. ~68 of a ~70 GB personal
  # budget is already spent, so the orchestrator refuses to launch a declared
  # cell that would not fit, holding back a 2 GB margin. min_free_gb is VRAM
  # and says nothing about disk.
  # ======================================================================

  # --- Q.1 sawtooth control. FIRST because it threatens a PUBLISHED result:
  # P.2-v2 branch A's phase-0 eviction locking. Run before anything is built on
  # top of that. Fixed floor 256 across all three arms (NOT fixed mean, which
  # would lock amplitude to floor via mean = B + I/2); the resulting dose
  # difference is one-sided, since interval 16 is the HARSHEST arm, so a
  # collapse there cannot be blamed on that arm being gentler.
  # Each arm is read separately: phase_amplitude_excess refuses mixed intervals.
  - name: replay-sawtooth-i16
    command: replay
    config: configs/experiments/replay_sawtooth_i16_q1.yaml
    run_name: replay-sawtooth-i16
    total: 200
    seeds: [11, 23, 47, 89]
    min_free_gb: 28
    progress_kind: grid      # counts runs/<run_name>/math500/**/*.jsonl, like every other replay cell
    est_output_gb: 0.11   # measured: replay-sawtooth-i16/64/256 are 0.105 GiB each
    requires: null

  - name: replay-sawtooth-i64
    command: replay
    config: configs/experiments/replay_sawtooth_i64_q1.yaml
    run_name: replay-sawtooth-i64
    total: 200
    seeds: [11, 23, 47, 89]
    min_free_gb: 28
    progress_kind: grid      # counts runs/<run_name>/math500/**/*.jsonl, like every other replay cell
    est_output_gb: 0.11   # measured: replay-sawtooth-i16/64/256 are 0.105 GiB each
    requires: replay-sawtooth-i16

  - name: replay-sawtooth-i256
    command: replay
    config: configs/experiments/replay_sawtooth_i256_q1.yaml
    run_name: replay-sawtooth-i256
    total: 200
    seeds: [11, 23, 47, 89]
    min_free_gb: 28
    progress_kind: grid      # counts runs/<run_name>/math500/**/*.jsonl, like every other replay cell
    est_output_gb: 0.11   # measured: replay-sawtooth-i16/64/256 are 0.105 GiB each
    requires: replay-sawtooth-i64

  # --- Q.1 READS. CPU-only re-analysis of profiles that already exist; no model,
  # no GPU (min_free_gb 1 because the schema requires a number). Queued rather
  # than run by hand so they execute unattended in the same window as everything
  # else and their provenance sits in the same place -- the P.2-v2 precedent.
  #
  # ONE PER ARM, forced by the code: phase_amplitude_excess refuses profiles that
  # mix compression intervals. The pre-registered Q.1 read is whether EACH arm's
  # excess excludes zero, never the ordering of magnitudes across arms, because
  # raw phase amplitude scales with bucket count.
  #
  # Each gated on ITS OWN generation cell, so a read can never run against a
  # partially written profile tree.
  - name: shape-sawtooth-i16
    command: shape
    config: configs/experiments/shape_sawtooth_i16_q1.yaml
    run_name: shape-sawtooth-i16
    total: 1
    seeds: [11]
    min_free_gb: 1
    progress_kind: marker
    marker: shape-sawtooth-i16/shape_sawtooth_i16.json
    requires: replay-sawtooth-i16

  - name: shape-sawtooth-i64
    command: shape
    config: configs/experiments/shape_sawtooth_i64_q1.yaml
    run_name: shape-sawtooth-i64
    total: 1
    seeds: [11]
    min_free_gb: 1
    progress_kind: marker
    marker: shape-sawtooth-i64/shape_sawtooth_i64.json
    requires: replay-sawtooth-i64

  - name: shape-sawtooth-i256
    command: shape
    config: configs/experiments/shape_sawtooth_i256_q1.yaml
    run_name: shape-sawtooth-i256
    total: 1
    seeds: [11]
    min_free_gb: 1
    progress_kind: marker
    marker: shape-sawtooth-i256/shape_sawtooth_i256.json
    requires: replay-sawtooth-i256

  # --- Q.2 onset-staggered replay, D_tv half. The experiment M.3 pointed at and
  # could not reach: t0 is a genuine third variable, because r = B/t says
  # nothing about how long compression has been running. Teacher-forced, cheap.
  # t0=0 is the always-on reference arm and must reproduce existing behaviour.
  - name: replay-onset-t0
    command: replay
    config: configs/experiments/replay_onset_t0_q2.yaml
    run_name: replay-onset-t0
    total: 400
    seeds: [11, 23, 47, 89]
    min_free_gb: 28
    progress_kind: grid      # counts runs/<run_name>/math500/**/*.jsonl, like every other replay cell
    est_output_gb: 0.20   # measured: replay-onset-t0 is 0.192 GiB
    requires: replay-sawtooth-i256

  - name: replay-onset-t512
    command: replay
    config: configs/experiments/replay_onset_t512_q2.yaml
    run_name: replay-onset-t512
    total: 400
    seeds: [11, 23, 47, 89]
    min_free_gb: 28
    progress_kind: grid      # counts runs/<run_name>/math500/**/*.jsonl, like every other replay cell
    est_output_gb: 0.20   # measured: replay-onset-t0 is 0.192 GiB
    requires: replay-onset-t0

  - name: replay-onset-t2048
    command: replay
    config: configs/experiments/replay_onset_t2048_q2.yaml
    run_name: replay-onset-t2048
    total: 400
    seeds: [11, 23, 47, 89]
    min_free_gb: 28
    progress_kind: grid      # counts runs/<run_name>/math500/**/*.jsonl, like every other replay cell
    est_output_gb: 0.20   # measured: replay-onset-t0 is 0.192 GiB
    requires: replay-onset-t512

  # --- Q.2 READ. The Q.1 reads were nearly forgotten the same way: generation
  # cells were queued and nothing computed the verdict, so a drained queue would
  # have looked finished with the question unanswered. Gated on ALL THREE onset
  # arms, because the slope needs every arm on the same traces -- a read against
  # a partially written arm would silently drop traces and put problem identity
  # into a quantity that is supposed to carry exposure alone.
  - name: onset-surface-q2
    command: onset-surface
    config: configs/experiments/onset_surface_q2.yaml
    run_name: onset-surface-q2
    total: 1
    seeds: [11]
    min_free_gb: 1
    progress_kind: marker
    marker: onset-surface-q2/onset_surface_q2.json
    requires: replay-onset-t2048

  # --- Q.5 latency-swept restoration. Converts the P.5 flat null into a
  # timescale, if the query-drift account is right. The lag selects WHICH
  # stashed entries return, by eviction age, holding the trigger fixed --
  # moving the trigger would confound staleness with position in the trace.
  # lag=1 first: it is the arm where DECAY predicts the largest effect, so it
  # is the one that can falsify the account soonest.
  - name: restoration-lag1
    command: replay
    config: configs/experiments/restoration_lag1_q5.yaml
    run_name: restoration-lag1
    total: 800
    seeds: [11, 23, 47, 89]
    min_free_gb: 28
    progress_kind: grid      # counts runs/<run_name>/math500/**/*.jsonl, like every other replay cell
    est_output_gb: 0.45   # measured: restoration-diss256-v2 (same shape) is 0.425 GiB
    requires: replay-onset-t2048
    blocked: "Amendment R.5 - the restoration press stashes the tail of a score-ordered tensor (not the evicted complement) and shares state across layers; the exact-lag protocol replaces this sweep, so these rows would be invalid"

  - name: restoration-lag4
    command: replay
    config: configs/experiments/restoration_lag4_q5.yaml
    run_name: restoration-lag4
    total: 800
    seeds: [11, 23, 47, 89]
    min_free_gb: 28
    progress_kind: grid      # counts runs/<run_name>/math500/**/*.jsonl, like every other replay cell
    est_output_gb: 0.45   # measured: restoration-diss256-v2 (same shape) is 0.425 GiB
    requires: restoration-lag1
    blocked: "Amendment R.5 - the restoration press stashes the tail of a score-ordered tensor (not the evicted complement) and shares state across layers; the exact-lag protocol replaces this sweep, so these rows would be invalid"

  - name: restoration-lag16
    command: replay
    config: configs/experiments/restoration_lag16_q5.yaml
    run_name: restoration-lag16
    total: 800
    seeds: [11, 23, 47, 89]
    min_free_gb: 28
    progress_kind: grid      # counts runs/<run_name>/math500/**/*.jsonl, like every other replay cell
    est_output_gb: 0.45   # measured: restoration-diss256-v2 (same shape) is 0.425 GiB
    requires: restoration-lag4
    blocked: "Amendment R.5 - the restoration press stashes the tail of a score-ordered tensor (not the evicted complement) and shares state across layers; the exact-lag protocol replaces this sweep, so these rows would be invalid"

  - name: restoration-lag64
    command: replay
    config: configs/experiments/restoration_lag64_q5.yaml
    run_name: restoration-lag64
    total: 800
    seeds: [11, 23, 47, 89]
    min_free_gb: 28
    progress_kind: grid      # counts runs/<run_name>/math500/**/*.jsonl, like every other replay cell
    est_output_gb: 0.45   # measured: restoration-diss256-v2 (same shape) is 0.425 GiB
    requires: restoration-lag16
    blocked: "Amendment R.5 - the restoration press stashes the tail of a score-ordered tensor (not the evicted complement) and shares state across layers; the exact-lag protocol replaces this sweep, so these rows would be invalid"

  - name: restoration-lag256
    command: replay
    config: configs/experiments/restoration_lag256_q5.yaml
    run_name: restoration-lag256
    total: 800
    seeds: [11, 23, 47, 89]
    min_free_gb: 28
    progress_kind: grid      # counts runs/<run_name>/math500/**/*.jsonl, like every other replay cell
    est_output_gb: 0.45   # measured: restoration-diss256-v2 (same shape) is 0.425 GiB
    requires: restoration-lag64
    blocked: "Amendment R.5 - the restoration press stashes the tail of a score-ordered tensor (not the evicted complement) and shares state across layers; the exact-lag protocol replaces this sweep, so these rows would be invalid"

  # ======================================================================
  # Amendment R.3 D_acc (Meeting #3 Task 1): FREE-RUNNING accuracy on the
  # (budget, compression_start_step) grid. Gate first: dacc-gate-smoke runs the
  # real-model parity/onset checks and writes dacc-gate-smoke-PASS.json only on
  # PASS; every cell requires it. Measured cost from grid-diss{256,2048}-tok
  # wallclock: ~14.4 GPU-h per 400-row cell, ~7.2 h on both GPUs, i.e. one
  # cell per window. Order t2048 -> t512 -> t0: the largest exposure contrast
  # lands first, and t0 (gated, start 0) doubles as a determinism control
  # against the legacy grid-diss rows for the same (pid, seed, press, budget).
  # est_output_gb: measured 24-45 MiB per 800 rows at these budgets -> ~17 MiB
  # per cell; 0.03 declared.
  - name: dacc-gate-smoke
    command: daccsmoke
    config: configs/experiments/dacc_gate_smoke_r3.yaml
    run_name: dacc-gate-smoke
    total: 1
    seeds: [11]
    min_free_gb: 24
    progress_kind: marker
    marker: dacc-gate-smoke-PASS.json
    gate: dacc_smoke
    requires: null

  # ======================================================================
  # Amendment R.9: Meeting #3 Tasks 2 (Q.3 attention channels) + 3 (Q.6 latent
  # split) in ONE capture replay. Queued AHEAD of the D_acc cells: Tasks 2/3
  # have no measured result yet. Chain: frozen basis -> real-model smoke gate
  # (full/full control, layer-0 algebra control, live position-map checks) ->
  # budget-256 cell (both registered estimands) ; budget 2048 is last in the
  # queue. Cost estimate from replay throughput (~25 fwd/s/GPU, mean 4.3k
  # steps/trace): 1 full + 4 compressed branches per trace -> ~12 h on 2 GPUs
  # for 400 conditions; the smoke measures the real figure.
  - name: q6-basis-fit
    command: basisfit
    config: configs/experiments/basis_fit_q6_r9.yaml
    run_name: q6-basis-fit
    total: 1
    seeds: [11]
    min_free_gb: 24
    progress_kind: marker
    marker: q6-basis-fit/basis/q6_basis.json
    est_output_gb: 0.03   # 28 x 3584 x 64 float32 basis + mean/scale ~ 27 MB
    gate: basis
    requires: null

  - name: capture-smoke
    command: capture
    config: configs/experiments/capture_math500_smoke_r9.yaml
    run_name: capture-smoke
    total: 1
    seeds: [11]
    min_free_gb: 28
    progress_kind: marker
    marker: capture-smoke-PASS.json
    gate: capture_smoke
    requires: q6-basis-fit

  - name: capture-b256
    command: capture
    config: configs/experiments/capture_math500_b256_r9.yaml
    run_name: capture-b256
    total: 400
    seeds: [11, 23, 47, 89]
    min_free_gb: 28
    progress_kind: grid
    est_output_gb: 0.03   # ~20 KB row + ~28 KB npz per condition
    requires: capture-smoke

  # Amendment R.5 exact-lag restoration (Task 2, restoration half). Requires the
  # capture smoke: it shares EventTap, which the smoke validates on the 7B model.
  # Cost ~650 paired forwards + 15 arms x 200 per (trace, policy) -> ~5 h on
  # 2 GPUs for 200 conditions.
  - name: exact-lag-r5
    command: exactlag
    config: configs/experiments/exact_lag_math500_r5.yaml
    run_name: exact-lag-r5
    total: 200
    seeds: [11, 23, 47, 89]
    min_free_gb: 28
    progress_kind: grid
    est_output_gb: 0.01
    requires: capture-smoke

  - name: dacc-t2048
    command: grid
    config: configs/experiments/grid_math500_dacc_t2048_r3.yaml
    run_name: dacc-t2048
    total: 400
    seeds: [11, 23, 47, 89]
    min_free_gb: 24
    progress_kind: grid
    est_output_gb: 0.03
    requires: dacc-gate-smoke

  - name: dacc-t512
    command: grid
    config: configs/experiments/grid_math500_dacc_t512_r3.yaml
    run_name: dacc-t512
    total: 400
    seeds: [11, 23, 47, 89]
    min_free_gb: 24
    progress_kind: grid
    est_output_gb: 0.03
    requires: dacc-gate-smoke

  - name: dacc-t0

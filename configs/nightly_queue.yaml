    run_name: dacc-t0
    total: 400
    seeds: [11, 23, 47, 89]
    min_free_gb: 24
    progress_kind: grid
    est_output_gb: 0.03
    requires: dacc-gate-smoke

  # Amendment R.2 / R.11: the Q.1 direct functional control (mask now, remove
  # 32 forwards later, fork before every removal). One job per policy (single
  # seed each) so both GPUs are used; ~T x ~3 forwards per (trace, interval),
  # ~11 GPU-h per job (est.).
  - name: fork-control-random
    command: forkcontrol
    config: configs/experiments/fork_control_random_r11.yaml
    run_name: fork-control-random
    total: 75
    seeds: [11]
    min_free_gb: 24
    progress_kind: grid
    est_output_gb: 0.01
    requires: null

  - name: fork-control-slm
    command: forkcontrol
    config: configs/experiments/fork_control_slm_r11.yaml
    run_name: fork-control-slm
    total: 75
    seeds: [11]
    min_free_gb: 24
    progress_kind: grid
    est_output_gb: 0.01
    requires: null

  - name: capture-b2048
    command: capture
    config: configs/experiments/capture_math500_b2048_r9.yaml
    run_name: capture-b2048
    blocked: "Amendment R.17 (2026-09-27) - held before its first row so the b2048 schema can gain per-query-head M/Delta and nested-k projection norms (R.17.2.1); release only with that schema landed and tested"
    total: 400
    seeds: [11, 23, 47, 89]
    min_free_gb: 28
    progress_kind: grid
    est_output_gb: 0.03
    requires: capture-smoke

  # Amendment R.17.0.5: the validity gate for every Meeting #3 divergence
  # result. First-fork diagnosis in bf16 and fp32, and the bf16-vs-fp32
  # precision floor the fork gap is judged against. One model at a time; fp32
  # 7B needs ~31 GB. Short (~1-2 h, est.); queued ahead of the long TV cells.
  - name: fork-precision
    command: forkprecision
    config: configs/experiments/fork_precision_r17.yaml
    run_name: fork-precision
    total: 1
    seeds: [11]
    min_free_gb: 40
    progress_kind: marker
    marker: fork-precision/fork_precision.json
    est_output_gb: 0.01
    gate: fork_precision
    requires: null

  # Amendment R.1 / R.12: TV at the intermediate budgets for Task 1, with
  # summary-only profiles (~3 KB/trace; the full format is what was BLOCKED on
  # storage). Paired replay, ~19 h on 2 GPUs for both cells (est.). Last in the
  # queue: Task 1 is already answered; these fill fig8 panel (c).
  - name: t1-tv512
    command: replay
    config: configs/experiments/replay_ext_math500_b512_r1.yaml
    run_name: t1-tv512
    total: 200
    seeds: [11, 23, 47, 89]
    min_free_gb: 24

name: pp_smoke_s1
stage: ppsmoke
# Amendment S.1 gate: real-model smoke of the prompt-protected presses before
# any powered row. Writes pp-smoke-PASS.json only if every registered check
# holds (scripts/pp_smoke.py).
prompt_protected: true
reference_run_name: math500-fc-powered-merged
models: [r1_distill_qwen_7b]
benchmarks: [math500]
subset:
  math500: 100
presses: [random_pp, streamingllm_pp]
budgets: [256]
seeds: [11]
compression_interval: 64
min_trace_tokens: 1024
replay_tokens: 1536
generation_cap: 700
identity_forced_prompt_len:
  random_pp: 0
  streamingllm_pp: 4
estimated_generation_count: 2
scale_authorized: true
remote_only: true

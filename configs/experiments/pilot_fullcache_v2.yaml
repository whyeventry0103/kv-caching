name: pilot_fullcache_v2
stage: bank
# v2 rebuild (2026-06-13): MATH-only at a 16384 cap. The v1 4096 cap was the sole
# source of failure in the audit (4/20 cells truncated, 0 genuine wrong, 0
# extraction failures), so it confounds accuracy and would confound compression.
# 16384 is ~4x the longest observed finisher (3484 tokens). RSP is excluded
# pending its redesign (its current order-invariant sum is not a recall-span probe).
models: [r1_distill_qwen_7b]
benchmarks: [math500]
subset:
  math500:
    count: 5
    stratify_by: level
presses: [fullcache]
budgets: [full]
seeds: [11, 23, 47, 89]
max_new_tokens:
  math500: 16384
estimated_generation_count: 20
remote_only: true
pilot: true
